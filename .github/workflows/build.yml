on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

name: build

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolver:
          - nightly
          - lts-24
          - lts-23
          - lts-22
          - lts-21
          - lts-20
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@latest
        with:
          enable-stack: true
          stack-no-global: true
      - run: stack build --resolver ${{ matrix.resolver }}
